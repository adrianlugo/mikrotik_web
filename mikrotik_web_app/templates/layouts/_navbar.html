<header class="flex items-center justify-between h-16 bg-white border-b border-gray-200 px-6">

    <!-- Usamos un style CSS limpio para ocultarlo solo si la pantalla mide más de 1024px (pantallas grandes) -->
    <button id="open-sidebar" style="display: flex;" class="p-2 mr-3 rounded-md text-gray-600 hover:bg-gray-100 items-center justify-center lg:hidden">
        <style>
            @media (min-width: 1024px) { #open-sidebar { display: none !important; } }
        </style>
        <i data-lucide="menu" class="w-6 h-6"></i>
    </button>



    <div class="text-sm font-medium text-gray-500">
        Bienvenido al panel del administrador
    </div>
    <div class="flex items-center gap-4">
        <!-- Indicador visual del modo simulación / producción -->
        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">
            <span class="h-1.5 w-1.5 rounded-full bg-amber-400"></span>
            {% if request.session.mikrotik_api_role %}{{ request.session.mikrotik_api_role }}{% else %}API conectada{% endif %}
        </span>
        {% if request.session.mikrotik_api_username %}
        <span class="hidden text-sm font-medium text-slate-600 sm:block">{{ request.session.mikrotik_api_username }}</span>
        {% endif %}
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="rounded-md border border-slate-200 px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-50" title="Cerrar sesión">
                Salir
            </button>
        </form>
    </div>
</header>
