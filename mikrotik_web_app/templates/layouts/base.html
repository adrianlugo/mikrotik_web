{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ISP Dashboard{% endblock %}</title>
    <!-- 📦 Cargando Tailwind CSS y estilos de la interfaz desde recursos locales -->
    <script src="{% static 'css/tailwind.min.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <!-- 📦 Cargando Íconos Lucide desde tu carpeta local (Sin Internet) -->
    <script src="{% static 'js/lucide.min.js' %}"></script>
</head>
<body class="h-screen bg-slate-50 font-sans text-gray-900 antialiased overflow-hidden">
    
    <!-- 🗂️ Contenedor Principal Completo -->
    <div class="flex h-full w-full overflow-hidden">
        
        <!-- 1. El Menú Lateral (Corregida la ruta para apuntar a sidebar.html) -->
        {% include 'layouts/_sidebar.html' %}
        
        <!-- 2. Área de Contenido Principal (Crece al 100% si el sidebar se oculta) -->
        <div class="flex flex-col flex-1 w-full h-full overflow-hidden">
            
            <!-- Barra Superior Modular (Corregida la ruta para apuntar a navbar.html) -->
            {% include 'layouts/_navbar.html' %}
            
            <!-- Espacio Principal Escindible con scroll independiente -->
            <main class="flex-1 relative overflow-y-auto p-6 focus:outline-none">
                <div class="max-w-7xl mx-auto">
                    {% if messages %}
                        <div class="mb-4 space-y-2">
                        {% for message in messages %}
                            <div class="rounded-md border px-4 py-3 text-sm {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-700{% else %}bg-emerald-50 border-emerald-200 text-emerald-700{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                        </div>
                    {% endif %}

                    {% block content %}
                    <!-- El contenido de cada página se inyectará aquí -->
                    {% endblock %}
                </div>
            </main>
        </div>
    </div>
    <!-- 📦 Cargando la librería local -->
    <script src="{% static 'js/lucide.min.js' %}"></script>    
        <!-- Script responsivo corregido contra bloqueos de redimensionamiento -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Forzar el renderizado de los iconos de Lucide
            if (window.lucide) {
                window.lucide.createIcons();
            }
            
            const sidebar = document.getElementById("sidebar");
            const openBtn = document.getElementById("open-sidebar");
            const closeBtn = document.getElementById("close-sidebar");

            // Abre el sidebar (Remueve la clase que lo saca de la pantalla)
            if (openBtn && sidebar) {
                openBtn.addEventListener("click", function() {
                    sidebar.classList.remove("-translate-x-full");
                });
            }

            // Cierra el sidebar (Añade la clase que lo saca de la pantalla)
            if (closeBtn && sidebar) {
                closeBtn.addEventListener("click", function() {
                    sidebar.classList.add("-translate-x-full");
                });
            }
        });
    </script>


    {% block extra_js %}{% endblock %}
</body>
</html>
