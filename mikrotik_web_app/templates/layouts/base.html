{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ISP Dashboard{% endblock %}</title>
    <!-- 📦 Cargando Tailwind CSS y estilos de la interfaz desde recursos locales -->
    <script src="{% static 'css/tailwind.min.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <!-- 📦 Cargando Íconos Lucide desde tu carpeta local (Sin Internet) -->
    <script src="{% static 'js/lucide.min.js' %}"></script>
</head>
<body class="h-full flex overflow-hidden bg-slate-50 font-sans text-gray-900">

    <!-- Menú Lateral Modular -->
    {% include 'layouts/_sidebar.html' %}

    <!-- Contenedor de Contenido Principal -->
    <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
        
        <!-- Barra Superior Modular -->
        {% include 'layouts/_navbar.html' %}

        <!-- Espacio Principal Escindible -->
        <main class="flex-1 relative overflow-y-auto focus:outline-none p-6">
            <div class="max-w-7xl mx-auto">
                {% if messages %}
                    <div class="mb-4 space-y-2">
                        {% for message in messages %}
                            <div class="rounded-md border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-700{% else %}border-emerald-200 bg-emerald-50 text-emerald-700{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
                {% block content %}
                <!-- El contenido de cada página se inyectará aquí -->
                {% endblock %}
            </div>
        </main>
    </div>

    <!-- Inicializar iconos automáticamente -->
    <script>
        lucide.createIcons();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
