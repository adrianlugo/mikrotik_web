{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - ISP MikroTik</title>
    <script src="{% static 'css/tailwind.min.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% static 'js/lucide.min.js' %}"></script>
</head>
<body class="h-full bg-slate-950">
    <main class="flex min-h-full items-center justify-center px-6 py-12">
        <section class="w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl">
            <div class="mb-8 text-center">
                <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 text-white">
                    <i data-lucide="router"></i>
                </div>
                <h1 class="mt-4 text-2xl font-bold text-slate-900">ISP MikroTik</h1>
                <p class="mt-2 text-sm text-slate-500">Inicia sesión con tu cuenta de la API.</p>
            </div>

            {% if messages %}
            <div class="mb-5 space-y-2">
                {% for message in messages %}
                <div class="rounded-md border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-700{% else %}border-emerald-200 bg-emerald-50 text-emerald-700{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700">Usuario</label>
                    <input id="username" name="username" type="text" autocomplete="username" required class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
                </div>
                <button type="submit" class="inline-flex w-full items-center justify-center gap-2 rounded-md bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    Iniciar sesión
                </button>
            </form>
        </section>
    </main>
    <script>
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
</body>
</html>
